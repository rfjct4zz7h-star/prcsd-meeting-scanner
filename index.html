<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>PRCSD Meeting Attendance</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f3f4f6;
      color:#111827;
    }

    .header{
      background:#0f1b5d;
      color:white;
      padding:18px;
      border-bottom:5px solid #ffdd00;
      text-align:center;
    }

    .header h1{
      margin:0;
      font-size:22px;
    }

    .header p{
      margin:5px 0 0;
      font-size:13px;
      opacity:.9;
    }

    .wrap{
      max-width:600px;
      margin:18px auto;
      padding:0 14px 30px;
    }

    .card{
      background:white;
      border:1px solid #d1d5db;
      border-radius:12px;
      padding:18px;
      margin-bottom:14px;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }

    label{
      display:block;
      font-weight:bold;
      margin-bottom:6px;
    }

    select{
      width:100%;
      padding:12px;
      font-size:16px;
      border:1px solid #9ca3af;
      border-radius:8px;
      background:white;
    }

    button{
      width:100%;
      padding:14px;
      border:0;
      border-radius:9px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    #startButton{
      background:#166534;
      color:white;
    }

    #stopButton{
      background:#991b1b;
      color:white;
      display:none;
    }

    #reader{
      width:100%;
      margin-top:15px;
      overflow:hidden;
      border-radius:12px;
    }

    .meetingInfo{
      margin-top:12px;
      padding:12px;
      background:#eff6ff;
      border:1px solid #bfdbfe;
      border-radius:8px;
      display:none;
    }

    .meetingName{
      font-weight:800;
      color:#0f1b5d;
      font-size:18px;
    }

    .meetingMeta{
      margin-top:4px;
      color:#4b5563;
      font-size:13px;
    }

    .countBox{
      text-align:center;
      margin-top:15px;
      padding:12px;
      background:#eff6ff;
      border-radius:10px;
      border:1px solid #bfdbfe;
    }

    .countNumber{
      font-size:32px;
      font-weight:900;
      color:#0f1b5d;
    }

    .countLabel{
      font-size:12px;
      font-weight:bold;
      color:#4b5563;
    }

    #result{
      display:none;
      margin-top:16px;
      padding:18px;
      border-radius:10px;
      text-align:center;
    }

    #result.good{
      display:block;
      background:#dcfce7;
      border:2px solid #86efac;
      color:#14532d;
    }

    #result.warn{
      display:block;
      background:#fef3c7;
      border:2px solid #fcd34d;
      color:#78350f;
    }

    #result.bad{
      display:block;
      background:#fee2e2;
      border:2px solid #fca5a5;
      color:#7f1d1d;
    }

    .resultIcon{
      font-size:38px;
    }

    .resultName{
      font-size:23px;
      font-weight:900;
      margin-top:5px;
    }

    .resultMessage{
      font-size:17px;
      font-weight:bold;
      margin-top:5px;
    }

    .resultMeta{
      font-size:13px;
      margin-top:7px;
      line-height:1.5;
    }

    #status{
      margin-top:12px;
      text-align:center;
      font-size:14px;
      color:#4b5563;
    }

    .recent{
      margin-top:18px;
      border-top:1px solid #d1d5db;
      padding-top:14px;
    }

    .recent h3{
      margin:0 0 8px;
      font-size:15px;
    }

    .recentRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:8px 0;
      border-bottom:1px solid #e5e7eb;
      font-size:13px;
    }

    .recentName{
      font-weight:bold;
    }

    .recentTime{
      color:#6b7280;
      white-space:nowrap;
    }

    .instructions{
      text-align:center;
      color:#6b7280;
      font-size:14px;
      line-height:1.5;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>PRCSD Meeting Attendance</h1>
  <p>Employee Badge Check-In</p>
</div>

<div class="wrap">

  <div class="card">

    <label for="meetingSelect">
      Select Meeting
    </label>

    <select id="meetingSelect">
      <option value="">
        Loading active meetings...
      </option>
    </select>

    <div id="meetingInfo"
         class="meetingInfo">

      <div id="meetingName"
           class="meetingName"></div>

      <div id="meetingMeta"
           class="meetingMeta"></div>

    </div>

    <div class="countBox">

      <div id="attendanceCount"
           class="countNumber">
        0
      </div>

      <div class="countLabel">
        CHECKED IN
      </div>

    </div>

  </div>


  <div class="card">

    <div class="instructions">
      Select a meeting, then tap
      <b>Start Scanner</b>.
      Hold each employee badge QR code
      inside the camera box.
    </div>

    <button id="startButton">
      Start Scanner
    </button>

    <button id="stopButton">
      Stop Scanner
    </button>

    <div id="reader"></div>

    <div id="status"></div>

    <div id="result">

      <div id="resultIcon"
           class="resultIcon"></div>

      <div id="resultName"
           class="resultName"></div>

      <div id="resultMessage"
           class="resultMessage"></div>

      <div id="resultMeta"
           class="resultMeta"></div>

    </div>


    <div class="recent">

      <h3>Recent Check-Ins</h3>

      <div id="recentList">
        No one has checked in yet.
      </div>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/a/macros/prc.k12.ms.us/s/AKfycbzJ_kofMXOlhOkVUVePSqU4nru1shomyxtG0qVRl4oRk_dJD3STyWmQOqlQiF5OD-nyVQ/exec";


let scanner = null;
let running = false;

let meetings = [];
let selectedMeeting = null;

let scanBusy = false;
let lastCode = "";
let lastTime = 0;

let jsonpCounter = 0;


/*
 * --------------------------------------------
 * JSONP COMMUNICATION WITH APPS SCRIPT
 * --------------------------------------------
 */

function callApi(params){

  return new Promise((resolve,reject)=>{

    jsonpCounter++;

    const callbackName =
      "__prcsdCallback" +
      Date.now() +
      "_" +
      jsonpCounter;

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(()=>{

        cleanup();

        reject(
          new Error(
            "Attendance system did not respond."
          )
        );

      },15000);


    function cleanup(){

      clearTimeout(timeout);

      try{
        delete window[callbackName];
      }catch(e){}

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }
    }


    window[callbackName] =
      function(result){

        cleanup();

        resolve(result);

      };


    const query =
      new URLSearchParams({
        ...params,
        callback:callbackName
      });


    script.onerror =
      function(){

        cleanup();

        reject(
          new Error(
            "Unable to connect to Attendance system."
          )
        );

      };


    script.src =
      API_URL +
      "?" +
      query.toString();


    document.body.appendChild(script);

  });

}


/*
 * --------------------------------------------
 * MEETINGS
 * --------------------------------------------
 */

async function loadMeetings(){

  const select =
    document.getElementById(
      "meetingSelect"
    );


  select.innerHTML =
    '<option value="">Loading active meetings...</option>';


  try{

    const result =
      await callApi({
        api:"meetings"
      });


    if(
      !result ||
      !result.ok
    ){

      throw new Error(
        result?.error ||
        "Meetings could not be loaded."
      );

    }


    meetings =
      result.meetings || [];


    select.innerHTML =
      '<option value="">Select a meeting...</option>';


    meetings.forEach(m=>{

      const option =
        document.createElement(
          "option"
        );

      option.value =
        m.meetingId;

      option.textContent =
        m.meetingName +
        " — " +
        m.meetingDate;

      select.appendChild(
        option
      );

    });


    if(!meetings.length){

      select.innerHTML =
        '<option value="">No active meetings found</option>';

    }

  }
  catch(err){

    select.innerHTML =
      '<option value="">Could not load meetings</option>';

    setStatus(
      err.message || String(err)
    );

  }

}


document
  .getElementById(
    "meetingSelect"
  )
  .addEventListener(
    "change",
    meetingChanged
  );


async function meetingChanged(){

  const id =
    document.getElementById(
      "meetingSelect"
    ).value;


  selectedMeeting =
    meetings.find(
      m =>
        m.meetingId === id
    ) || null;


  if(!selectedMeeting){

    document
      .getElementById(
        "meetingInfo"
      )
      .style.display =
        "none";

    return;

  }


  document
    .getElementById(
      "meetingName"
    )
    .textContent =
      selectedMeeting.meetingName;


  document
    .getElementById(
      "meetingMeta"
    )
    .textContent =
      selectedMeeting.meetingDate +
      (
        selectedMeeting.location
          ? " • " +
            selectedMeeting.location
          : ""
      );


  document
    .getElementById(
      "meetingInfo"
    )
    .style.display =
      "block";


  clearResult();

  await loadSummary();

}


/*
 * --------------------------------------------
 * ATTENDANCE SUMMARY
 * --------------------------------------------
 */

async function loadSummary(){

  if(!selectedMeeting){
    return;
  }


  try{

    const result =
      await callApi({

        api:"summary",

        meetingId:
          selectedMeeting.meetingId

      });


    if(
      !result ||
      !result.ok
    ){
      return;
    }


    document
      .getElementById(
        "attendanceCount"
      )
      .textContent =
        String(
          result.count || 0
        );


    renderRecent(
      result.recent || []
    );

  }
  catch(err){

    console.log(err);

  }

}


/*
 * --------------------------------------------
 * CAMERA
 * --------------------------------------------
 */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startScanner
  );


document
  .getElementById(
    "stopButton"
  )
  .addEventListener(
    "click",
    stopScanner
  );


async function startScanner(){

  if(!selectedMeeting){

    alert(
      "Select a meeting first."
    );

    return;

  }


  if(running){
    return;
  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try{

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        }
      },

      qrCodeSuccess,

      function(){
        // Ignore frames with no QR.
      }

    );


    running = true;


    document
      .getElementById(
        "startButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "stopButton"
      )
      .style.display =
        "block";


    setStatus(
      "Scanner ready. Scan an employee badge."
    );

  }
  catch(err){

    alert(
      "Camera could not start:\n\n" +
      (
        err.message ||
        err
      )
    );

  }

}


async function stopScanner(){

  if(
    !scanner ||
    !running
  ){
    return;
  }


  try{

    await scanner.stop();

    await scanner.clear();

  }
  catch(err){

    console.log(err);

  }


  running = false;

  scanner = null;


  document
    .getElementById(
      "startButton"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "stopButton"
    )
    .style.display =
      "none";


  setStatus(
    "Scanner stopped."
  );

}


/*
 * --------------------------------------------
 * QR SUCCESS
 * --------------------------------------------
 */

async function qrCodeSuccess(
  decodedText
){

  const now =
    Date.now();


  if(scanBusy){
    return;
  }


  if(
    decodedText ===
      lastCode &&

    now -
      lastTime <
      6000
  ){

    return;

  }


  lastCode =
    decodedText;

  lastTime =
    now;


  scanBusy =
    true;


  setStatus(
    "Checking badge..."
  );


  try{

    const result =
      await callApi({

        api:"scan",

        meetingId:
          selectedMeeting.meetingId,

        qr:
          decodedText

      });


    handleScanResult(
      result
    );

  }
  catch(err){

    showBad(
      err.message ||
      String(err)
    );

  }
  finally{

    scanBusy =
      false;

  }

}


/*
 * --------------------------------------------
 * RESULT DISPLAY
 * --------------------------------------------
 */

function handleScanResult(
  result
){

  if(
    !result ||
    !result.ok
  ){

    showBad(
      result?.error ||
      "Badge was not accepted."
    );

    return;

  }


  const person =
    result.person || {};


  if(
    result.duplicate
  ){

    showResult(
      "warn",
      "⚠️",
      person.name ||
        "Badge Holder",
      "Already Checked In",

      [
        person.department,

        person.badgeNumber
          ? "Badge #" +
            person.badgeNumber
          : "",

        result.scanTime
          ? "Original check-in: " +
            result.scanTime
          : ""

      ]
      .filter(Boolean)
      .join(" • ")

    );


    document
      .getElementById(
        "attendanceCount"
      )
      .textContent =
        String(
          result.count || 0
        );


    vibrate(
      [120,80,120]
    );


    setStatus(
      "Already checked in. Scan the next badge."
    );

    return;

  }


  showResult(
    "good",
    "✅",
    person.name ||
      "Badge Holder",
    "CHECKED IN",

    [
      person.department,

      person.badgeNumber
        ? "Badge #" +
          person.badgeNumber
        : "",

      result.scanTime || ""

    ]
    .filter(Boolean)
    .join(" • ")

  );


  document
    .getElementById(
      "attendanceCount"
    )
    .textContent =
      String(
        result.count || 0
      );


  vibrate(
    150
  );


  setStatus(
    "Check-in recorded. Scan the next badge."
  );


  loadSummary();

}


function showBad(
  message
){

  showResult(
    "bad",
    "❌",
    "",
    "NOT CHECKED IN",
    message
  );


  vibrate(
    [200,100,200]
  );


  setStatus(
    "Badge not accepted."
  );

}


function showResult(
  type,
  icon,
  name,
  message,
  meta
){

  const box =
    document.getElementById(
      "result"
    );


  box.className =
    type;


  document
    .getElementById(
      "resultIcon"
    )
    .textContent =
      icon || "";


  document
    .getElementById(
      "resultName"
    )
    .textContent =
      name || "";


  document
    .getElementById(
      "resultMessage"
    )
    .textContent =
      message || "";


  document
    .getElementById(
      "resultMeta"
    )
    .textContent =
      meta || "";

}


function clearResult(){

  const box =
    document.getElementById(
      "result"
    );

  box.className = "";

  box.style.display =
    "none";

}


function setStatus(
  text
){

  document
    .getElementById(
      "status"
    )
    .textContent =
      text || "";

}


function vibrate(
  pattern
){

  try{

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        pattern
      );

    }

  }
  catch(e){}

}


/*
 * --------------------------------------------
 * RECENT ATTENDANCE
 * --------------------------------------------
 */

function renderRecent(
  rows
){

  const el =
    document.getElementById(
      "recentList"
    );


  if(
    !rows ||
    !rows.length
  ){

    el.innerHTML =
      "No one has checked in yet.";

    return;

  }


  el.innerHTML =
    rows.map(r=>{

      return `

        <div class="recentRow">

          <div>

            <div class="recentName">
              ${escapeHtml(r.name)}
            </div>

            <div>
              ${escapeHtml(
                r.department || ""
              )}
            </div>

          </div>

          <div class="recentTime">
            ${escapeHtml(
              shortTime(
                r.scanTime
              )
            )}
          </div>

        </div>

      `;

    }).join("");

}


function shortTime(
  text
){

  const s =
    String(text || "");


  const m =
    s.match(
      /(\d{1,2}:\d{2}:\d{2}\s[AP]M)$/i
    );


  return m
    ? m[1]
    : s;

}


function escapeHtml(
  value
){

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
 * START
 */

loadMeetings();

</script>

</body>
</html>
